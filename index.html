<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pessoal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #2d3748;
            line-height: 1.6;
        }

        /* Topo simplificado */
        .top-bar {
            background-color: #4fc3f7; /* Azul celeste */
            padding: 1rem;
            text-align: center;
        }

        .top-bar h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #ffffff;
        }

        /* Container principal */
        .container {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .agenda-panel {
            background-color: #f9f9f9; /* Fundo claro */
            padding: 2rem;
            border-radius: 10px;
            border: 1px solid #e6e6e6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* Grupos de campos */
        .field-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #6b46c1; /* Lilás */
        }

        input[type="date"], textarea {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid #4fc3f7; /* Azul celeste */
            border-radius: 6px;
            font-size: 1rem;
            background-color: #ffffff;
            transition: all 0.3s ease;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        input[type="date"]:focus, textarea:focus {
            outline: none;
            border-color: #6b46c1; /* Lilás */
            box-shadow: 0 0 0 3px rgba(107, 70, 193, 0.1);
        }

        /* Botões */
        .buttons-area {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.9rem 1.8rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn-save {
            background-color: #4fc3f7; /* Azul celeste */
            color: white;
        }

        .btn-print {
            background-color: #6b46c1; /* Lilás */
            color: white;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        /* Responsividade */
        @media (max-width: 450px) {
            .buttons-area {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>Agenda</h1>
    </div>

    <div class="container">
        <div class="agenda-panel">
            <div class="field-group">
                <label for="selected-date">Selecionar Dia:</label>
                <input type="date" id="selected-date" name="selected-date">
            </div>

            <div class="field-group">
                <label for="notes-text">Anotações:</label>
                <textarea id="notes-text" name="notes-text" placeholder="Digite suas anotações aqui..."></textarea>
            </div>

            <div class="buttons-area">
                <button class="btn btn-save" onclick="saveNote()">Salvar</button>
                <button class="btn btn-print" onclick="window.print()">Imprimir</button>
            </div>
        </div>
    </div>

    <script>
        function saveNote() {
            const date = document.getElementById('selected-date').value;
            const text = document.getElementById('notes-text').value;

            if (!date) {
                alert('Por favor, selecione um dia primeiro!');
                return;
            }

            localStorage.setItem(`agenda_note_${date}`, text);
            alert('Anotação salva com sucesso!');
            loadNote();
        }

        function loadNote() {
            const date = document.getElementById('selected-date').value;
            const savedNote = localStorage.getItem(`agenda_note_${date}`);
            document.getElementById('notes-text').value = savedNote || '';
        }

        document.getElementById('selected-date').addEventListener('change', loadNote);
    </script>
</body>
</html>
